name: postbear release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: >
          Compress-Archive
          -Path target/release/postbear.exe, README.md
          -DestinationPath "postbear-${{ github.ref_name }}-windows-x64.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "postbear-${{ github.ref_name }}-windows-x64.zip"
          --title "postbear ${{ github.ref_name }}"
          --generate-notes
