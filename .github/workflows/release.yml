name: postbear release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip version from tag (v0.2.0 -> 0.2.0)
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV ("VER=" + "${{ github.ref_name }}".TrimStart("v"))

      - name: Install Inno Setup
        run: choco install innosetup -y

      # choco 的 innosetup 核心包不含非官方语言文件，单独补中文界面
      - name: Fetch Chinese language file
        shell: pwsh
        run: >
          Invoke-WebRequest
          -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl"
          -OutFile "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\ChineseSimplified.isl"

      - name: Build installer
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/DAppVersion=$env:VER" packaging/postbear.iss

      - name: Package portable zip
        shell: pwsh
        run: >
          Compress-Archive
          -Path target/release/postbear.exe, README.md
          -DestinationPath "postbear-${{ github.ref_name }}-windows-x64.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "postbear-${{ github.ref_name }}-windows-x64.zip"
          "packaging/output/postbear-setup-$env:VER.exe"
          --title "postbear ${{ github.ref_name }}"
          --generate-notes
